name: Woke Network native Firedancer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woke-network-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-firedancer:
    name: Native Firedancer build and unit checks
    runs-on: [self-hosted, linux, x64, woke-firedancer]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
          version: 11.2.2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned policy and patch checksums
        run: pnpm network:woke:check

      - name: Materialize pinned downstream fork
        run: pnpm network:woke:materialize -- "$RUNNER_TEMP/woke-firedancer"

      - name: Fetch pinned dependency source and install host packages
        working-directory: ${{ runner.temp }}/woke-firedancer
        env:
          FD_AUTO_INSTALL_PACKAGES: '1'
        run: |
          ./deps.sh fetch
          ./deps.sh check

      - name: Build and attest native binaries in a disposable tracked checkout
        run: pnpm network:woke:binary-check -- "$RUNNER_TEMP/woke-firedancer"

      - name: Reject forbidden runtime processes
        shell: bash
        run: |
          if ! command -v pgrep >/dev/null; then
            echo "::error::pgrep is required to enforce the forbidden-process gate"
            exit 1
          fi
          for process_name in agave-validator fdctl fddev solana-test-validator; do
            if pgrep -f "(^|/)$process_name([[:space:]]|$)" >/dev/null; then
              echo "::error::Forbidden runtime process is active: $process_name"
              exit 1
            fi
          done

      - name: Recheck patched source
        run: pnpm network:woke:source-check -- "$RUNNER_TEMP/woke-firedancer"
